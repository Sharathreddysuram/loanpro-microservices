spring.application.name=LOAN-SERVICE
server.port=8082
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/loanpro_loans?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

# Must match auth-service's jwt.secret so tokens issued there validate here.
# DEV-ONLY default - override with the JWT_SECRET environment variable.
jwt.secret=${JWT_SECRET:mysecretkeymysecretkeymysecretkeymysecretkey}

management.endpoints.web.exposure.include=health,info
