spring.application.name=API-GATEWAY
server.port=8080
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

# Routes (load-balanced through Eureka service names)
spring.cloud.gateway.server.webmvc.routes[0].id=auth-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.server.webmvc.routes[1].id=loan-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://LOAN-SERVICE
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/loans/**

spring.cloud.gateway.server.webmvc.routes[2].id=decision-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://DECISION-SERVICE
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/decisions/**

management.endpoints.web.exposure.include=health,info,gateway
